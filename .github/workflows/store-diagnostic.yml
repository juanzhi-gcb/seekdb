name: Cached journal read attribution
on:
  push:
    branches: ['codex/exact-store-diagnostic-20261115']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare cached reads, diagnostic only
        run: |
          mkdir store-results
          lscpu > store-results/lscpu.txt
          for name in a24 cpu scratch; do
            ref=7db149c649fb6eb31c58d4490ce3796d55d5259e
            if [[ "$name" == a24 ]]; then ref=a24d2cd764027adec7371f268f99ccdca2307032; fi
            mkdir /tmp/read-$name
            git archive "$ref" include src/storage | tar -x -C /tmp/read-$name
            if [[ "$name" == scratch ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/read-scratch/src/storage/journal_store.hpp');s=p.read_text();assert s.count('Page scratch{};const Page* page=nullptr;')==1;p.write_text(s.replace('Page scratch{};const Page* page=nullptr;','Page scratch;const Page* page=nullptr;'))
          PY
            fi
            g++ -std=c++20 -O3 -DNDEBUG -ffp-contract=off -I/tmp/read-$name/include bench/store_probe.cpp /tmp/read-$name/src/storage/store.cpp -o /tmp/read-$name/probe
            /tmp/read-$name/probe > store-results/$name.txt
            objdump -d -C /tmp/read-$name/probe > /tmp/read-$name/assembly.txt
            python3 - "$name" <<'PY'
          from pathlib import Path
          import sys
          name=sys.argv[1];lines=Path('/tmp/read-'+name+'/assembly.txt').read_text().splitlines();out=[];active=False
          for line in lines:
              if line.endswith('>:'):active='JournalStore::read_framed' in line
              if active:out.append(line)
          Path('store-results/'+name+'-read-assembly.txt').write_text('\n'.join(out)+'\n')
          PY
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cached-read-diagnostic-${{ github.run_id }}
          path: store-results/
