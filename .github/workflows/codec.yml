name: Compact writer and alignment arithmetic isolated screen
on:
  push:
    branches: ['codex/j11-codec-screen-20261113']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Byte compatible codec, sanitizer and paired storage timings
        run: bash bench/codec6000/screen.sh
      - name: Preserve samples and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codec-${{ matrix.replica }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            codec-results/
          if-no-files-found: error
          retention-days: 14
