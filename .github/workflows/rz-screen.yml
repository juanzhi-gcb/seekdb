name: Experimental exact lower-bound screen
"on":
  push:
    branches: ['codex/score-rz-screen-20261112']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check exactness and interleaved native performance
        env:
          NATIVE_REPLICA: ${{ matrix.replica }}
        run: bash bench/run_rz_screen.sh
      - name: Preserve complete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rz-screen-${{ matrix.replica }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: rz-screen-results/
          if-no-files-found: error
          retention-days: 14
