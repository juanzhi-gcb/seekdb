name: Native conservative bounds screen
on:
  push:
    branches: ['codex/robust-bounds-2882-20261113']
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare exact certificate costs and validate numeric bounds
        run: bash bench/after2882/bounds_run.sh
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounds2882-${{ matrix.replica }}-${{ github.run_id }}
          path: bounds-results/
          retention-days: 14
