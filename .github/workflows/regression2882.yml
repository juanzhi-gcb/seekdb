name: Full scoring metrics for adaptive bounds versus a24 and dfee
on:
  push:
    branches: ['codex/post2882-full-20261113']
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Three versions, four distributions, exact rows and native resources
        run: bash bench/after2882/run.sh
      - name: Preserve raw measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full2882-${{ matrix.replica }}-${{ github.run_id }}
          path: regression-results/
          retention-days: 14
