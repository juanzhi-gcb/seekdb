name: Diagnose exact benchmark resource drain on unchanged a24
on:
  push:
    branches: ['codex/a24-drain-probe-20261114']
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Same a24 image both sides; diagnostics only
        run: bash bench/drain-probe/run.sh
      - name: Preserve failed sampling diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: drain-probe-${{ matrix.replica }}-${{ github.run_id }}
          path: drain-probe-results/
          retention-days: 14
