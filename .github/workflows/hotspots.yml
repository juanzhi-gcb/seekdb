name: A24 endpoint latency diagnosis
on:
  push:
    branches: ['codex/a24-hotspots-20261114']
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Aggregate endpoint and phase timers with original fast paths
        run: bash bench/hotspots/run.sh
      - name: Preserve raw results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hotspots-${{ matrix.replica }}-${{ github.run_id }}
          path: hotspots-results/
          retention-days: 14
