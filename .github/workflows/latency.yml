name: Matched native request and syscall latency diagnosis
on:
  push:
    branches: ['codex/stages-6000-20261113']
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identical diagnostic wrappers and protocol oracle
        run: bash bench/latency6000/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: latency-${{ matrix.replica }}-${{ github.run_id }}
          path: latency-results/
          retention-days: 14
