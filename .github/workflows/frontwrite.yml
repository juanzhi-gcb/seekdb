name: Frontend write latency attribution
on:
  push:
    branches: ['codex/frontend-write-diagnostic-20261113']
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Five paired write phases and unchanged persistence oracle per schema
        run: bash bench/frontwrite6000/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontwrite-${{ matrix.replica }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontwrite-results/
          retention-days: 14
