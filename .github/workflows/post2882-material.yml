name: Post-regression learning material provenance
on:
  push:
    branches: ['codex/post2882-evidence-20261113']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify measured runtime is unchanged
        run: git diff --exit-code eab4636980f4e5878e7c793298423e1772716a68 HEAD -- src include tests Dockerfile CMakeLists.txt
      - name: Verify entry points, quotations and exact archived provenance
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 -B scripts/check-submission-contract.py --check-internal-references
          python3 -B scripts/check-learning-material.py
          python3 -B tests/learning_selection_tests.py
          python3 -B tests/submission_contract_tests.py
