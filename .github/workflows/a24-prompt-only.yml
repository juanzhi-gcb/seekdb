name: A24 prompt-only material validation
on:
  push:
    branches: ['codex/a24-prompt-only-20261114']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify a24 baseline identity
        run: git diff --exit-code a24d2cd764027adec7371f268f99ccdca2307032 HEAD -- src include tests Dockerfile CMakeLists.txt
      - name: Verify material and archived provenance
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 -B scripts/check-submission-contract.py --check-internal-references
          python3 -B scripts/check-learning-material.py
          python3 -B tests/learning_selection_tests.py
          python3 -B tests/submission_contract_tests.py
      - name: Verify current implementation evidence
        run: |
          python3 - <<'PYCODE'
          import json, hashlib
          from pathlib import Path
          d=json.loads(Path('agent/conversation.json').read_text())
          assert d['source_identity']['verified_engine_commit']=='a24d2cd764027adec7371f268f99ccdca2307032'
          for m in d['implementation_map']:
              for f in m['files']:
                  assert hashlib.sha256(Path(f['path']).read_bytes()).hexdigest()==f['sha256'],f['path']
          for step in d['a24_development_chain']:
              for name in step.get('code',[])+step.get('tests',[]):
                  assert Path(name).is_file(),name
          prompt=d['implementation_prompt']
          assert prompt['status']=='retrospective_specification_not_historical_dialogue'
          assert prompt['independent_reconstruction']=='not_performed'
          assert prompt['content']==Path('agent/implementation-prompt.txt').read_text()
          assert {r['requirement'] for r in d['requirements_traceability']}=={'R'+str(i) for i in range(1,11)}
          for requirement in d['requirements_traceability']:
              for name in requirement['code']+requirement['tests']:
                  assert Path(name).is_file(),name
          manifest=json.loads(Path('agent/material-digest.json').read_text())
          identity=manifest['current_source_identity']
          assert identity['verified_engine_commit']==d['source_identity']['verified_engine_commit']
          assert identity['runtime_trees']==d['source_identity']['runtime_trees']
          assert 'native_run_id' not in identity
          assert set(prompt['required_companions'])==set(d['implementation_contracts'])
          for path, meta in d['implementation_contracts'].items():
              raw=Path(path).read_bytes()
              assert len(raw)==meta['bytes'],path
              assert hashlib.sha256(raw).hexdigest()==meta['sha256'],path
          for module in d['implementation_map']:
              assert all(int(ref['id'][1:])<=70 for ref in module['request_evidence'])
          assert Path('conversation.json').read_bytes()==Path('agent/conversation.json').read_bytes()
          print('a24 hashes, contracts, version identities, chronology and evidence paths passed')
          PYCODE
