name: MiniVectorDB native x86 batch experiment
on:
  push:
    branches: ['codex/score-batch-native-20261111']
permissions:
  contents: read
concurrency:
  group: mvdb-batch-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact public source without stored credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/juanzhi-gcb/seekdb.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = x86_64
          uname -a
          lscpu
      - name: Build frozen baseline toolchain and database
        shell: bash
        run: |
          set -euo pipefail
          docker build --target test --tag mvdb:batch-baseline .
          docker image inspect --format '{{.Id}}' mvdb:batch-baseline
      - name: Compare exact batch kernels on native x86_64
        shell: bash
        run: bash bench/run_batch_native.sh
      - name: Scope
        if: always()
        shell: bash
        run: |
          echo 'Native x86_64 core-query experiment; shared-runner timing is not the competition E score. Production branch and submitted database implementation are unchanged.' >> "$GITHUB_STEP_SUMMARY"
