[package]
name = "file-sql"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native Parquet record decoder for seekdb file table scans"

[lib]
name = "file_sql"
crate-type = ["staticlib", "rlib"]

[dependencies]
parquet = { version = "60.0.0", default-features = false, features = ["snap", "brotli", "flate2-rust_backend", "lz4", "zstd", "json"] }
serde_json = { version = "1", features = ["preserve_order"] }
